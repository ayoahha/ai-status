name: collect

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Aucun droit par défaut : chaque job déclare le minimum
permissions: {}

# Une collecte à la fois par ref ; on met en file plutôt que d'annuler, pour ne jamais
# interrompre un déploiement Pages en cours
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Mettre en cache les navigateurs Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-
      - name: Installer Chromium (Playwright)
        run: npx playwright install chromium
      - run: npm test

  collect:
    # Les PR ne collectent ni ne déploient : tests seulement
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false : pas de jeton dans .git/config pendant la collecte
      # de sources tierces
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Collecter les statuts
        run: node collect.mjs
      - name: Vérifier le JSON produit
        # Même contrat que le producteur et le navigateur, avec les identités déclarées
        run: |
          test -s public/data/status.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { assertStatusDocument, MAX_STATUS_BYTES } from './public/status-contract.js';
            const text = readFileSync('public/data/status.json', 'utf8');
            if (Buffer.byteLength(text) > MAX_STATUS_BYTES) throw new Error('status.json dépasse la borne de publication');
            assertStatusDocument(JSON.parse(text), JSON.parse(readFileSync('providers.json', 'utf8')));
          "
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    # Seule main publie : un workflow_dispatch sur une autre branche s'arrête à la collecte
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
