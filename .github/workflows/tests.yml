name: tests

on:
  pull_request:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit exact à tester
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier le commit attendu
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$EXPECTED_SHA" ]; then
            echo "Le SHA attendu est obligatoire pour un lancement manuel" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_SHA" ] && [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "La branche a changé : nouvelle validation nécessaire" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Mettre en cache les navigateurs Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-
      - name: Installer Chromium (Playwright)
        run: npx playwright install chromium
      - run: npm test
